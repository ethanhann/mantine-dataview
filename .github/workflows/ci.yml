name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Audit dependencies
        # Scope to what actually ships: dev-only advisories (e.g. Storybook) must
        # not gate the published library. Raise the bar to "high" for runtime deps.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      # Hand the coverage summary to the Deploy Storybook workflow (which runs via
      # workflow_run after this one), so the badge is generated without re-running
      # the whole test suite there.
      - name: Upload coverage summary
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

      - name: Build library
        run: npm run build

      - name: Validate package
        run: |
          npm run lint:package
          npm run check:exports

      - name: Build Storybook
        run: npm run storybook:build
